<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#040714"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="url(#bgGrad)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1.5"/>

  <!-- Subtle grid rings -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-dasharray="4 4"/>
  <circle cx="100" cy="100" r="48" fill="none" stroke="rgba(6, 182, 212, 0.1)" stroke-width="1.5"/>

  <!-- Glowing Dumbbell & Kinetic Motion Icon -->
  <g filter="url(#glow)">
    <!-- Dumbbell Bar -->
    <line x1="68" y1="100" x2="132" y2="100" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Left Weight Plates -->
    <rect x="56" y="74" width="12" height="52" rx="4" fill="url(#accentGrad)"/>
    <rect x="46" y="82" width="8" height="36" rx="3" fill="#10b981" opacity="0.85"/>

    <!-- Right Weight Plates -->
    <rect x="132" y="74" width="12" height="52" rx="4" fill="url(#accentGrad)"/>
    <rect x="146" y="82" width="8" height="36" rx="3" fill="#3b82f6" opacity="0.85"/>

    <!-- Center Grip Rings -->
    <line x1="94" y1="96" x2="94" y2="104" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="100" y1="96" x2="100" y2="104" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="106" y1="96" x2="106" y2="104" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Kinetic Motion Orbit -->
  <path d="M 64 64 A 52 52 0 0 1 136 64" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" opacity="0.6" stroke-dasharray="5 3"/>
  <path d="M 136 136 A 52 52 0 0 1 64 136" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.6" stroke-dasharray="5 3"/>

  <!-- Pulse dots -->
  <circle cx="100" cy="56" r="3" fill="#06b6d4"/>
  <circle cx="100" cy="144" r="3" fill="#10b981"/>

  <text x="100" y="172" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1.5">PHYSIOTWIN MOTION</text>
</svg>
