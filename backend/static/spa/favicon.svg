<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield with Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="6" opacity="0.4" />

  <!-- Ambient Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.25" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#6366F1" stroke-width="1" stroke-dasharray="4 6" opacity="0.15" />

  <!-- Biomechanical Twin Holographic Node Geometry -->
  <!-- Upper Cranial / Cervical Node -->
  <g filter="url(#glow)">
    <circle cx="256" cy="115" r="32" fill="url(#cyanBlueGrad)" />
    <circle cx="256" cy="115" r="18" fill="#FFFFFF" opacity="0.9" />

    <!-- Shoulders & Upper Thoracic Nodes -->
    <path d="M140 185 L256 160 L372 185" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Spine Axis -->
    <line x1="256" y1="145" x2="256" y2="330" stroke="url(#cyanBlueGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Lumbar & Rib Nodes -->
    <line x1="180" y1="230" x2="332" y2="230" stroke="url(#cyanBlueGrad)" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <line x1="200" y1="280" x2="312" y2="280" stroke="url(#cyanBlueGrad)" stroke-width="8" stroke-linecap="round" opacity="0.8" />

    <!-- Pelvic / Kinetic Core Ring -->
    <polygon points="256,310 325,360 256,410 187,360" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="10" stroke-linejoin="round" />
    <circle cx="256" cy="360" r="16" fill="#38BDF8" />
    <circle cx="256" cy="360" r="8" fill="#FFFFFF" />

    <!-- Joint Markers -->
    <circle cx="140" cy="185" r="14" fill="#38BDF8" />
    <circle cx="140" cy="185" r="6" fill="#FFFFFF" />
    <circle cx="372" cy="185" r="14" fill="#38BDF8" />
    <circle cx="372" cy="185" r="6" fill="#FFFFFF" />

    <circle cx="180" cy="230" r="8" fill="#60A5FA" />
    <circle cx="332" cy="230" r="8" fill="#60A5FA" />

    <!-- Limb Projections -->
    <line x1="140" y1="185" x2="105" y2="285" stroke="url(#cyanBlueGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="105" cy="285" r="10" fill="#38BDF8" />

    <line x1="372" y1="185" x2="407" y2="285" stroke="url(#cyanBlueGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="407" cy="285" r="10" fill="#38BDF8" />

    <!-- Lower Kinetic Chains -->
    <line x1="200" y1="385" x2="170" y2="445" stroke="url(#cyanBlueGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="170" cy="445" r="10" fill="#38BDF8" />

    <line x1="312" y1="385" x2="342" y2="445" stroke="url(#cyanBlueGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="342" cy="445" r="10" fill="#38BDF8" />
  </g>

  <!-- Pulse Aura -->
  <circle cx="256" cy="256" r="8" fill="#38BDF8" filter="url(#softGlow)" />
</svg>